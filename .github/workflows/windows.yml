name: Windows portable app
on:
  workflow_dispatch:
  push:
    paths: ['windows/**', 'web/**', 'Sources/MoonRabbit/Resources/**', 'scripts/prepare-web-assets.py', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: python ../scripts/prepare-web-assets.py
      - run: pnpm test
      - name: Windows native Electron smoke
        run: pnpm smoke
      - run: pnpm dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: MoonRabbit-Windows-x64
          path: windows/dist/*.exe
          retention-days: 7
          if-no-files-found: error
